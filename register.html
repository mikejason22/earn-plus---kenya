<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Earn Plus Kenya</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f5f1;
    }

    .container {
      max-width: 400px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #087443;
    }

    p {
      text-align: center;
      color: #555;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 6px;
      background: #087443;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #065c35;
    }

    .note {
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Earn Plus Kenya</h1>
    <p>Create your account</p>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="e.g. 07XXXXXXXX"
        required
      >

      <label for="password">Create Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="8"
        required
      >

      <button type="submit">Create Account</button>

    </form>

    <p id="message"></p>

    <p class="note">
      Registration is not yet connected to a secure account system.
      Do not enter real personal information or passwords until
      secure registration has been configured.
    </p>
  </div>

  <script>
    document.getElementById("registerForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
          "Registration system is not connected yet. Please try again later.";
      });
  </script>

</body>
</html>
